<!-- Split Payment & Multi-tender Modal -->
<div class="modal fade" id="splitPaymentModal" tabindex="-1" aria-labelledby="splitPaymentModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <!-- Modal Header -->
            <div class="modal-header bg-dark text-white border-0 py-3 px-4">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-info bg-opacity-10 p-2 me-2 text-info">
                        <i class="fas fa-layer-group fs-5"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fs-6 fw-bold mb-0" id="splitPaymentModalLabel">
                            Split Payment & Digital Wallets
                        </h5>
                        <small class="text-white-50 fs-xs">Multi-tender payment breakdown & transaction tracking</small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-4 bg-light bg-opacity-25">
                <!-- Balance Overview Cards -->
                <div class="row g-2 mb-3">
                    <div class="col-sm-6">
                        <div class="p-3 bg-white rounded-3 border shadow-sm d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted fs-xs text-uppercase fw-semibold d-block">Bill Payable Total</span>
                                <span class="fs-4 fw-bold text-primary" id="splitModalPayableTotal">Rs. 0.00</span>
                            </div>
                            <div class="rounded-circle bg-primary bg-opacity-10 p-3 text-primary">
                                <i class="fas fa-receipt fs-5"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-white rounded-3 border shadow-sm d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted fs-xs text-uppercase fw-semibold d-block">Remaining Balance</span>
                                <span class="fs-4 fw-bold text-danger" id="splitRemainingBalance">Rs. 0.00</span>
                            </div>
                            <div class="rounded-circle bg-danger bg-opacity-10 p-3 text-danger">
                                <i class="fas fa-balance-scale-right fs-5"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Payment Methods Grid -->
                <div class="card border-0 shadow-sm rounded-3 p-3 bg-white mb-2">
                    <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                        <span class="fs-xs fw-bold text-uppercase text-secondary">
                            <i class="fas fa-wallet me-1"></i> Payment Distribution (रकम विभाजन)
                        </span>
                        <span class="fs-xs text-muted">Enter Amount & Reference ID</span>
                    </div>

                    <div class="row g-3">
                        <!-- 1. Cash Payment -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-money-bill-wave text-success me-1"></i> Cash (नगद)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitCashAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0">
                            </div>
                        </div>

                        <!-- 2. Customer Udhaari (Credit) -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-hand-holding-dollar text-danger me-1"></i> Customer Udhaari (Credit बाँकी)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitCreditAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0">
                            </div>
                        </div>

                        <!-- 3. FonePay QR -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-qrcode text-danger me-1"></i> FonePay QR (फोनपे)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitFonepayAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0" style="flex: 1 1 45%;">
                                <input type="text" id="splitFonepayRef" class="form-control" placeholder="Trace ID / Ref" style="flex: 1 1 55%;">
                            </div>
                        </div>

                        <!-- 4. eSewa -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-wallet text-success me-1"></i> eSewa (ईसेवा)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitEsewaAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0" style="flex: 1 1 45%;">
                                <input type="text" id="splitEsewaRef" class="form-control" placeholder="Transaction Code" style="flex: 1 1 55%;">
                            </div>
                        </div>

                        <!-- 5. Khalti -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-mobile-screen-button text-purple me-1" style="color: #5c2d91;"></i> Khalti (खल्ती)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitKhaltiAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0" style="flex: 1 1 45%;">
                                <input type="text" id="splitKhaltiRef" class="form-control" placeholder="Payment Ref" style="flex: 1 1 55%;">
                            </div>
                        </div>

                        <!-- 6. POS Card Swipe -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-credit-card text-primary me-1"></i> POS Card Swipe (कार्ड)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitCardAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0" style="flex: 1 1 45%;">
                                <input type="text" id="splitCardRef" class="form-control" placeholder="Slip / Approval No" style="flex: 1 1 55%;">
                            </div>
                        </div>

                        <!-- 7. Bank Transfer / ConnectIPS -->
                        <div class="col-md-12">
                            <label class="form-label fw-semibold fs-xs mb-1 text-dark">
                                <i class="fas fa-building-columns text-info me-1"></i> Bank Transfer / ConnectIPS (बैंक ट्रान्सफर)
                            </label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted px-2">Rs.</span>
                                <input type="number" id="splitBankAmt" class="form-control split-pay-input fw-semibold" placeholder="0.00" step="0.01" min="0" style="flex: 1 1 40%;">
                                <input type="text" id="splitBankRef" class="form-control" placeholder="ConnectIPS / Cheque No" style="flex: 1 1 60%;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer bg-light border-0 px-4 py-3 d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-pill" data-bs-dismiss="modal">
                    <i class="fas fa-times me-1"></i> Cancel
                </button>
                <button type="button" class="btn btn-success btn-sm px-4 rounded-pill fw-bold shadow-sm" id="confirmSplitPaymentBtn">
                    <i class="fas fa-check-circle me-1"></i> Finalize Split Payment
                </button>
            </div>
        </div>
    </div>
</div>
