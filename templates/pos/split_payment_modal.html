<div class="modal fade" id="splitPaymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header bg-dark text-white border-0 py-3">
                <h5 class="modal-title fs-6 fw-bold">
                    <i class="fas fa-layer-group text-info me-2"></i> Split Payment & Digital Wallets
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-light rounded-3 border">
                    <span class="fw-bold text-dark">Bill Payable Total:</span>
                    <span class="fs-4 fw-bold text-primary" id="splitModalPayableTotal">Rs. 0.00</span>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold fs-xs"><i class="fas fa-money-bill-wave text-success"></i> Cash (नगद)</label>
                        <input type="number" id="splitCashAmt" class="form-control form-control-sm split-pay-input" placeholder="0.00" step="0.01">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold fs-xs"><i class="fas fa-qrcode text-danger"></i> FonePay QR (फोनपे)</label>
                        <input type="number" id="splitFonepayAmt" class="form-control form-control-sm split-pay-input" placeholder="0.00" step="0.01">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold fs-xs"><i class="fas fa-wallet text-success"></i> eSewa (ईसेवा)</label>
                        <input type="number" id="splitEsewaAmt" class="form-control form-control-sm split-pay-input" placeholder="0.00" step="0.01">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold fs-xs"><i class="fas fa-credit-card text-primary"></i> POS Card Swipe</label>
                        <input type="number" id="splitCardAmt" class="form-control form-control-sm split-pay-input" placeholder="0.00" step="0.01">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold fs-xs"><i class="fas fa-hand-holding-dollar text-danger"></i> Customer Udhaari (Credit)</label>
                        <input type="number" id="splitCreditAmt" class="form-control form-control-sm split-pay-input" placeholder="0.00" step="0.01">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center text-xs p-2 rounded bg-light border">
                    <span>Remaining Balance:</span>
                    <strong id="splitRemainingBalance" class="text-danger">Rs. 0.00</strong>
                </div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success btn-sm px-4 rounded-pill fw-bold" id="confirmSplitPaymentBtn">
                    <i class="fas fa-check-circle me-1"></i> Finalize Split Payment
                </button>
            </div>
        </div>
    </div>
</div>
