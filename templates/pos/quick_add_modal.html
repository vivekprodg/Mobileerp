<div class="modal fade" id="quickAddProductModal" tabindex="-1" aria-labelledby="quickAddProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden bg-white">
            <form id="quickProductAddForm" action="{% url 'products:quick_create' %}" method="post">
                {% csrf_token %}

                <!-- Hidden Tax Classification & Safety Fields for Non-JS / Direct Submissions -->
                <input type="hidden" name="tax_pricing_type" value="{% if IS_VAT_MODE %}INCLUSIVE{% else %}EXEMPT{% endif %}">
                <input type="hidden" name="is_vat_applicable" value="{% if IS_VAT_MODE %}true{% else %}false{% endif %}">
                <input type="hidden" name="vat_rate" value="{{ DEFAULT_TAX_RATE|default:'0.00' }}">

                <div class="modal-header bg-primary text-white border-0 py-3">
                    <h5 class="modal-title fs-6 fw-bold" id="quickAddProductModalLabel">
                        <i class="fas fa-plus-circle me-2"></i> Quick Add Small Accessory / Product
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold text-dark fs-xs">Product Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" id="quickProdName" class="form-control" placeholder="e.g. 20W Type-C Fast Charger / Tempered Glass" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold text-dark fs-xs">Product Barcode (Optional)</label>
                            <input type="text" name="barcode" id="quickProdBarcode" class="form-control font-monospace" placeholder="Scan physical barcode or leave blank (Optional)">
                            <small class="text-muted fs-2xs mt-1 d-block">Scan box barcode or leave empty if this item has no barcode.</small>
                        </div>
                        
                        <!-- Asynchronous Dynamic Categories Dropdown -->
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-dark fs-xs">Category <span class="text-danger">*</span></label>
                            <div class="position-relative">
                                <select name="category" 
                                        id="quickProdCategory" 
                                        class="form-select" 
                                        data-autocomplete-url="/inventory/api/categories/search/" 
                                        required>
                                    <option value="">-- Loading Categories... --</option>
                                </select>
                                <div id="quickProdCategorySpinner" class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 translate-middle-y me-4 d-none" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>

                        <!-- Asynchronous Dynamic Units Dropdown -->
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-dark fs-xs">Base Unit <span class="text-danger">*</span></label>
                            <div class="position-relative">
                                <select name="base_unit" 
                                        id="quickProdUnit" 
                                        class="form-select" 
                                        data-autocomplete-url="/inventory/api/units/search/" 
                                        required>
                                    <option value="">-- Loading Units... --</option>
                                </select>
                                <div id="quickProdUnitSpinner" class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 translate-middle-y me-4 d-none" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Selling Price / MRP (NPR) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="selling_price" id="quickProdSellPrice" class="form-control font-monospace" placeholder="150.00" required>
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Cost Price (NPR)</label>
                            <input type="number" step="0.01" name="purchase_price" id="quickProdCostPrice" class="form-control font-monospace" placeholder="80.00" value="0.00">
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Initial Opening Stock</label>
                            <input type="number" step="1" name="initial_stock" id="quickProdStock" class="form-control font-monospace" value="10">
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Rack / Shelf Location</label>
                            <input type="text" name="rack_number" id="quickProdRack" class="form-control" placeholder="e.g. Rack-A1">
                        </div>

                        <input type="hidden" name="requires_imei_tracking" value="false">
                    </div>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm px-4 rounded-pill fw-bold shadow-sm">
                        <i class="fas fa-check-circle me-1"></i> Save &amp; Add to Cart
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
/**
 * Asynchronous Category & Base Unit Zero-Query Loader for Quick Add Accessory Modal
 */
(function() {
    const quickModal = document.getElementById('quickAddProductModal');
    if (!quickModal) return;

    let categoriesLoaded = false;
    let unitsLoaded = false;

    async function fetchAndPopulateCategories() {
        const categorySelect = document.getElementById('quickProdCategory');
        const spinner = document.getElementById('quickProdCategorySpinner');
        if (!categorySelect) return;

        const url = categorySelect.dataset.autocompleteUrl || '/inventory/api/categories/search/';
        if (spinner) spinner.classList.remove('d-none');

        try {
            const response = await fetch(`${url}?q=&limit=100`, {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const results = Array.isArray(data) ? data : (data.results || data.categories || []);

            categorySelect.innerHTML = '<option value="">-- Select Category --</option>';
            if (results.length > 0) {
                results.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name || cat.title;
                    categorySelect.appendChild(opt);
                });
                categoriesLoaded = true;
            } else {
                categorySelect.innerHTML = '<option value="">-- No Categories Configured --</option>';
            }
        } catch (err) {
            console.warn('Asynchronous category lookup error:', err);
            categorySelect.innerHTML = `
                <option value="">-- General / Accessories --</option>
                <option value="1">Mobile Accessories</option>
                <option value="2">Chargers & Cables</option>
                <option value="3">Tempered Glass & Covers</option>
            `;
        } finally {
            if (spinner) spinner.classList.add('d-none');
        }
    }

    async function fetchAndPopulateUnits() {
        const unitSelect = document.getElementById('quickProdUnit');
        const spinner = document.getElementById('quickProdUnitSpinner');
        if (!unitSelect) return;

        const url = unitSelect.dataset.autocompleteUrl || '/inventory/api/units/search/';
        if (spinner) spinner.classList.remove('d-none');

        try {
            const response = await fetch(`${url}?q=&limit=100`, {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const results = Array.isArray(data) ? data : (data.results || data.units || []);

            unitSelect.innerHTML = '';
            if (results.length > 0) {
                results.forEach((unit, idx) => {
                    const opt = document.createElement('option');
                    opt.value = unit.id;
                    const symbol = unit.symbol || unit.code ? ` (${unit.symbol || unit.code})` : '';
                    opt.textContent = `${unit.name}${symbol}`;
                    // Default to piece / pcs if matched
                    const lowerName = (unit.name || '').toLowerCase();
                    const lowerCode = (unit.code || unit.symbol || '').toLowerCase();
                    if (idx === 0 || lowerName.includes('piece') || lowerCode === 'pcs') {
                        opt.selected = true;
                    }
                    unitSelect.appendChild(opt);
                });
                unitsLoaded = true;
            } else {
                unitSelect.innerHTML = `
                    <option value="1" selected>Piece (Pcs)</option>
                    <option value="2">Pair (PR)</option>
                    <option value="3">Set</option>
                    <option value="4">Box</option>
                `;
            }
        } catch (err) {
            console.warn('Asynchronous units lookup error:', err);
            unitSelect.innerHTML = `
                <option value="1" selected>Piece (Pcs)</option>
                <option value="2">Pair (PR)</option>
                <option value="3">Set</option>
                <option value="4">Box</option>
            `;
        } finally {
            if (spinner) spinner.classList.add('d-none');
        }
    }

    // Zero-query auto-fill triggered whenever the modal is opened
    quickModal.addEventListener('show.bs.modal', function() {
        if (!categoriesLoaded) {
            fetchAndPopulateCategories();
        }
        if (!unitsLoaded) {
            fetchAndPopulateUnits();
        }
    });
})();
</script>
