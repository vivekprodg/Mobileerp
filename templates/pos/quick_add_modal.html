<div class="modal fade" id="quickAddProductModal" tabindex="-1" aria-labelledby="quickAddProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden bg-white">
            <form id="quickProductAddForm" action="{% url 'products:quick_create' %}" method="post">
                {% csrf_token %}

                <!-- Hidden Tax Classification & Safety Fields for Non-JS / Direct Submissions -->
                <input type="hidden" name="tax_pricing_type" value="{% if IS_VAT_MODE %}INCLUSIVE{% else %}EXEMPT{% endif %}">
                <input type="hidden" name="is_vat_applicable" value="{% if IS_VAT_MODE %}true{% else %}false{% endif %}">
                <input type="hidden" name="vat_rate" value="{{ DEFAULT_TAX_RATE|default:'0.00' }}">

                <div class="modal-header bg-primary text-white border-0 py-3">
                    <h5 class="modal-title fs-6 fw-bold" id="quickAddProductModalLabel">
                        <i class="fas fa-plus-circle me-2"></i> Quick Add Product / Accessory
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold text-dark fs-xs">Product Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" id="quickProdName" class="form-control" placeholder="e.g. 20W Type-C Fast Charger / Galaxy A55 5G" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold text-dark fs-xs">Product Barcode (Optional)</label>
                            <input type="text" name="barcode" id="quickProdBarcode" class="form-control font-monospace" placeholder="Scan physical barcode or leave blank (Optional)">
                            <small class="text-muted fs-2xs mt-1 d-block">Scan box barcode or leave empty if this item has no barcode.</small>
                        </div>
                        
                        <!-- Asynchronous Dynamic Categories Dropdown -->
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-dark fs-xs">Category <span class="text-danger">*</span></label>
                            <div class="position-relative">
                                <select name="category" 
                                        id="quickProdCategory" 
                                        class="form-select" 
                                        data-autocomplete-url="/inventory/api/categories/search/" 
                                        required>
                                    <option value="">-- Loading Categories... --</option>
                                </select>
                                <div id="quickProdCategorySpinner" class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 translate-middle-y me-4 d-none" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>

                        <!-- Asynchronous Dynamic Units Dropdown -->
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-dark fs-xs">Base Unit <span class="text-danger">*</span></label>
                            <div class="position-relative">
                                <select name="base_unit" 
                                        id="quickProdUnit" 
                                        class="form-select" 
                                        data-autocomplete-url="/inventory/api/units/search/" 
                                        required>
                                    <option value="">-- Loading Units... --</option>
                                </select>
                                <div id="quickProdUnitSpinner" class="spinner-border spinner-border-sm text-primary position-absolute end-0 top-50 translate-middle-y me-4 d-none" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Selling Price / MRP (NPR) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" name="selling_price" id="quickProdSellPrice" class="form-control font-monospace" placeholder="150.00" required>
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Cost Price (NPR)</label>
                            <input type="number" step="0.01" min="0" name="purchase_price" id="quickProdCostPrice" class="form-control font-monospace" placeholder="80.00" value="0.00">
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Initial Opening Stock</label>
                            <input type="number" step="1" min="0" name="initial_stock" id="quickProdStock" class="form-control font-monospace" value="10">
                        </div>

                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Rack / Shelf Location</label>
                            <input type="text" name="rack_number" id="quickProdRack" class="form-control" placeholder="e.g. Rack-A1">
                        </div>

                        <!-- Intelligent Warranty Duration Field (Defaults to 0 for accessories, 12 for phones) -->
                        <div class="col-6">
                            <label class="form-label fw-bold text-dark fs-xs">Warranty Duration</label>
                            <div class="input-group input-group-sm">
                                <input type="number" step="1" min="0" name="warranty_months" id="posQuickAddWarrantyMonths" class="form-control font-monospace text-center fw-bold" value="0" placeholder="0">
                                <span class="input-group-text bg-white text-muted fs-2xs border-start-0">Months</span>
                            </div>
                            <small class="text-muted fs-3xs" id="posQuickAddWarrantyHelp">0M for accessories; 12M for smartphones.</small>
                        </div>

                        <!-- Serialized IMEI Tracking Toggle Switch -->
                        <div class="col-6 d-flex align-items-center">
                            <div class="form-check form-switch mt-3">
                                <input type="checkbox" name="requires_imei_tracking" id="posQuickAddRequiresImei" class="form-check-input" value="true">
                                <label class="form-check-label fw-bold text-dark fs-xs" for="posQuickAddRequiresImei">
                                    Track 15-Digit IMEI (Phone)
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm px-4 rounded-pill fw-bold shadow-sm" id="posQuickProductSubmitBtn">
                        <i class="fas fa-check-circle me-1"></i> Save &amp; Add to Cart
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
/**
 * Asynchronous Category & Base Unit Zero-Query Loader + Intelligent Warranty Synchronization
 */
(function() {
    const quickModal = document.getElementById('quickAddProductModal');
    if (!quickModal) return;

    let categoriesLoaded = false;
    let unitsLoaded = false;

    const quickForm = document.getElementById('quickProductAddForm');
    const imeiToggle = document.getElementById('posQuickAddRequiresImei');
    const warrantyInput = document.getElementById('posQuickAddWarrantyMonths');
    const warrantyHelp = document.getElementById('posQuickAddWarrantyHelp');
    const categorySelect = document.getElementById('quickProdCategory');

    function syncWarrantyFromImeiToggle() {
        if (!imeiToggle || !warrantyInput) return;
        if (imeiToggle.checked) {
            if (!warrantyInput.value || warrantyInput.value === '0') {
                warrantyInput.value = '12';
            }
            if (warrantyHelp) warrantyHelp.textContent = '12M Phone Warranty Active (Body 12M / Batt 6M / Screen 3M).';
        } else {
            warrantyInput.value = '0';
            if (warrantyHelp) warrantyHelp.textContent = '0M for consumable accessory.';
        }
    }

    if (imeiToggle) {
        imeiToggle.addEventListener('change', syncWarrantyFromImeiToggle);
    }

    function checkCategoryForPhone(catText) {
        const lower = (catText || '').toLowerCase();
        return lower.includes('phone') || lower.includes('mobile') || lower.includes('smartphone') || lower.includes('ह्यान्डसेट') || lower.includes('स्मार्टफोन');
    }

    if (categorySelect) {
        categorySelect.addEventListener('change', function() {
            const selectedText = categorySelect.options[categorySelect.selectedIndex]?.text || '';
            if (checkCategoryForPhone(selectedText)) {
                if (imeiToggle) imeiToggle.checked = true;
                syncWarrantyFromImeiToggle();
            } else if (categorySelect.value) {
                if (imeiToggle) imeiToggle.checked = false;
                syncWarrantyFromImeiToggle();
            }
        });
    }

    async function fetchAndPopulateCategories() {
        const spinner = document.getElementById('quickProdCategorySpinner');
        if (!categorySelect) return;

        const url = categorySelect.dataset.autocompleteUrl || '/inventory/api/categories/search/';
        if (spinner) spinner.classList.remove('d-none');

        try {
            const response = await fetch(`${url}?q=&limit=100`, {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const results = Array.isArray(data) ? data : (data.results || data.categories || []);

            categorySelect.innerHTML = '<option value="">-- Select Category --</option>';
            if (results.length > 0) {
                results.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name || cat.title;
                    categorySelect.appendChild(opt);
                });
                categoriesLoaded = true;
            } else {
                categorySelect.innerHTML = '<option value="">-- No Categories Configured --</option>';
            }
        } catch (err) {
            console.warn('Asynchronous category lookup error:', err);
            categorySelect.innerHTML = `
                <option value="">-- General / Accessories --</option>
                <option value="1">Mobile Accessories</option>
                <option value="2">Chargers & Cables</option>
                <option value="3">Tempered Glass & Covers</option>
            `;
        } finally {
            if (spinner) spinner.classList.add('d-none');
        }
    }

    async function fetchAndPopulateUnits() {
        const unitSelect = document.getElementById('quickProdUnit');
        const spinner = document.getElementById('quickProdUnitSpinner');
        if (!unitSelect) return;

        const url = unitSelect.dataset.autocompleteUrl || '/inventory/api/units/search/';
        if (spinner) spinner.classList.remove('d-none');

        try {
            const response = await fetch(`${url}?q=&limit=100`, {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const results = Array.isArray(data) ? data : (data.results || data.units || []);

            unitSelect.innerHTML = '';
            if (results.length > 0) {
                results.forEach((unit, idx) => {
                    const opt = document.createElement('option');
                    opt.value = unit.id;
                    const symbol = unit.symbol || unit.code ? ` (${unit.symbol || unit.code})` : '';
                    opt.textContent = `${unit.name}${symbol}`;
                    const lowerName = (unit.name || '').toLowerCase();
                    const lowerCode = (unit.code || unit.symbol || '').toLowerCase();
                    if (idx === 0 || lowerName.includes('piece') || lowerCode === 'pcs') {
                        opt.selected = true;
                    }
                    unitSelect.appendChild(opt);
                });
                unitsLoaded = true;
            } else {
                unitSelect.innerHTML = `
                    <option value="1" selected>Piece (Pcs)</option>
                    <option value="2">Pair (PR)</option>
                    <option value="3">Set</option>
                    <option value="4">Box</option>
                `;
            }
        } catch (err) {
            console.warn('Asynchronous units lookup error:', err);
            unitSelect.innerHTML = `
                <option value="1" selected>Piece (Pcs)</option>
                <option value="2">Pair (PR)</option>
                <option value="3">Set</option>
                <option value="4">Box</option>
            `;
        } finally {
            if (spinner) spinner.classList.add('d-none');
        }
    }

    // Modal show event: Populates options and synchronizes warranty defaults cleanly
    quickModal.addEventListener('show.bs.modal', function() {
        if (!categoriesLoaded) {
            fetchAndPopulateCategories();
        }
        if (!unitsLoaded) {
            fetchAndPopulateUnits();
        }

        // Intelligently sync warranty based on current checkbox state (no forced zero)
        syncWarrantyFromImeiToggle();
    });

    // Handle AJAX Form Submission & Cart Integration
    if (quickForm && !quickForm.dataset.listenerAttached) {
        quickForm.dataset.listenerAttached = 'true';
        quickForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Ensure warranty input has a safe numeric fallback before submission
            if (warrantyInput && (!warrantyInput.value || warrantyInput.value.trim() === '')) {
                warrantyInput.value = (imeiToggle && imeiToggle.checked) ? '12' : '0';
            }

            const costInput = document.getElementById('quickProdCostPrice');
            if (costInput && (!costInput.value || costInput.value.trim() === '')) {
                costInput.value = '0.00';
            }

            const submitBtn = document.getElementById('posQuickProductSubmitBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Saving...';
            }

            try {
                const formData = new FormData(quickForm);
                const resp = await fetch(quickForm.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                const data = await resp.json();

                if (data.status === 'success') {
                    // 1. Refresh POS catalog pool if catalogService is active
                    if (window.smartPos && window.smartPos.catalogService && typeof window.smartPos.catalogService.fetchProducts === 'function') {
                        window.smartPos.catalogService.fetchProducts('');
                    }

                    // 2. Add directly to POS active cart if POS engine is running
                    if (window.smartPos && window.smartPos.cart && typeof window.smartPos.cart.addItem === 'function') {
                        window.smartPos.cart.addItem({
                            id: data.product_id,
                            product_id: data.product_id,
                            name: data.name,
                            price: parseFloat(data.selling_price || 0),
                            unit_price: parseFloat(data.selling_price || 0),
                            requires_imei: data.requires_imei || false,
                            requires_imei_tracking: data.requires_imei || false,
                            unit_code: data.unit || 'Pcs'
                        });
                    }

                    // 3. Dismiss modal and reset form
                    const modalInst = bootstrap.Modal.getInstance(quickModal);
                    if (modalInst) modalInst.hide();
                    quickForm.reset();

                    if (window.smartPos && typeof window.smartPos.showNotification === 'function') {
                        window.smartPos.showNotification(`Product '${data.name}' created and added to cart!`, 'success');
                    }
                } else {
                    const err = data.errors ? JSON.stringify(data.errors) : (data.message || 'Validation error saving product.');
                    alert('Could not save product: ' + err);
                }
            } catch (err) {
                console.error('Quick product submission error:', err);
                alert('Server communication error. Please try again.');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Save &amp; Add to Cart';
                }
            }
        });
    }
})();
</script>
